<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Vanilla JS Site</title>
</head>
<body>
    <h1>Blog Entries</h1>
    <div id="posts-container">Loading articles...</div>

    <script>
        const GITHUB_USERNAME = 'your-github-username';
        const REPO_NAME = 'my-vanilla-cms';
        
        async function fetchDatabase() {
            // Read directly from GitHub CDN 
            const dbUrl = `https://githubusercontent.com{GITHUB_USERNAME}/${REPO_NAME}/main/data/posts.json`;
            
            try {
                const res = await fetch(dbUrl);
                const posts = await res.json();
                
                const container = document.getElementById('posts-container');
                if (posts.length === 0) {
                    container.innerHTML = '<p>No posts published yet.</p>';
                    return;
                }
                
                container.innerHTML = posts.map(post => `
                    <article style="border-bottom: 1px solid #ccc; padding: 10px 0;">
                        <h3>${post.title}</h3>
                        <small>${new Date(post.createdAt).toLocaleString()}</small>
                        <p>${post.content}</p>
                    </article>
                `).join('');
            } catch (err) {
                document.getElementById('posts-container').innerText = 'Failed loading dataset.';
            }
        }

        fetchDatabase();
    </script>
</body>
</html>
